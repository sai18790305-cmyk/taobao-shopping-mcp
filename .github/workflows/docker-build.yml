name: Docker build validation

on:
  push:
    branches: [agent/docker-multistage-build]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build --tag taobao-shopping-mcp:validation .
