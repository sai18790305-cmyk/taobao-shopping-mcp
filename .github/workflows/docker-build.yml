name: Validate Docker build

on:
  push:
    branches:
      - agent/browser-lifecycle

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag taobao-shopping-mcp:validation .
